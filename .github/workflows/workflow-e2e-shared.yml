name: e2e shared
# Logique commune aux trois cas (pr / merge / tag), résolus par le job `guard` de
# workflow-e2e-trigger.yml : build de l'APK, déclenchement de l'e2e dans ami-system-tests,
# publication de l'APK/version si version_tag != ''. Le reporting (check « e2e (ami-system-tests) » sur le commit testé et commentaire
# UNIQUE de la PR si pr_number != 0, JUnit/artefacts par plateforme) est fait par le job `report` de workflow-e2e-main.yml : ce fichier n'a plus de job de rapport.
# Mirroir de ami-notifications-api/.github/workflows/workflow-e2e-webapp-shared.yml, avec
# build + publish en plus : contrairement à la webapp, ami-app-android doit produire l'APK
# lui-même (ami-system-tests ne build jamais d'app native, cf. son ADR CI).
#
# Appelé aussi bien par workflow-e2e-trigger.yml (événements réels) que par
# workflow-e2e-manual.yml (workflow_dispatch séparé, pour des essais) — ce fichier ne sait
# pas qui l'appelle, il ne fait qu'exécuter les inputs reçus.
on:
  workflow_call:
    inputs:
      run_android:
        description: "nom de la suite android à lancer (test-suites.ts : mobile_ci, mobile_short, mobile_all…)"
        type: string
        required: true
      android_device:
        description: "AVD Android au format pixel_<profil>_api<niveau> : pixel_2_api30 = appareil ancien, pixel_8_api36 = récent (targetSdk)"
        type: string
        default: pixel_2_api30
      report_label:
        description: "étiquette (lettres, chiffres, - _) quand plusieurs runs e2e rapportent sur le même commit/PR (ex. old-device) : un check (et un commentaire) par étiquette"
        type: string
        default: ''
      pr_number:
        description: "0 = pas de PR associée (merge/tag) → pas de commentaire de PR"
        type: number
        default: 0
      source_sha:
        description: "SHA d'ami-app-android à faire tester — vide = SHA du job build (github.sha)"
        type: string
        default: ''
      checkout_ref:
        description: "ref (branche/tag/sha) d'ami-system-tests à checkout ; PROVISOIRE : 77-migre-vers-wdio-10 (la même que `uses` ci-dessous), à repasser sur main à la fusion"
        type: string
        default: 77-migre-vers-wdio-10
      version_tag:
        description: "tag de la version, passé en argument pour être testable en manuel"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Écrire config/.env.staging
        env:
          ENV_STAGING: ${{ secrets.ENV_STAGING }}
        run: printf '%s\n' "$ENV_STAGING" > config/.env.staging

      - name: Build APK staging debug
        # --build-cache : réutilise les sorties de tâches (compilation, etc.) d'un run à
        # l'autre via ~/.gradle/caches/build-cache-1, déjà sauvegardé par setup-gradle.
        # --configuration-cache : réutilise le résultat de la phase de configuration Gradle.
        # --parallel : exécute app/buildSrc en parallèle quand c'est possible.
        run: sh ./gradlew assembleStagingDebug --build-cache --configuration-cache --parallel

      - name: Lire la version depuis output-metadata.json
        id: version
        run: |
          META=app/build/outputs/apk/staging/debug/output-metadata.json
          NAME=$(jq -r '.elements[0].versionName' "$META")
          CODE=$(jq -r '.elements[0].versionCode' "$META")
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-staging-debug
          path: app/build/outputs/apk/staging/debug/app-staging-debug.apk
          overwrite: true # un re-run garderait le même run_id → même nom d'artefact.

  e2e-launch:
    name: trigger an e2e run in ami-system-tests
    needs: build
    # TANT QUE les changements d'ami-system-tests (job report, suites mobile_*, sorties) ne sont pas fusionnés dans master/main, cette ref
    # est la branche qui les porte ; à repointer vers main une fois fusionnés.
    uses: numerique-gouv/ami-system-tests/.github/workflows/workflow-e2e-main.yml@77-migre-vers-wdio-10
    # Le workflow appelé ne peut pas dépasser ces permissions : checks (check du commit testé) et pull-requests (commentaire unique).
    permissions:
      contents: read
      checks: write
      pull-requests: write
    with:
      run_webapp: ''
      run_android: ${{ inputs.run_android }}
      android_device: ${{ inputs.android_device }}
      report_label: ${{ inputs.report_label }}
      source_repo: ${{ github.repository }}
      source_sha: ${{ inputs.source_sha || github.sha }}
      pr_number: 0 # les tests android tournent toujours sur l'env staging
      comment_pr_number: ${{ inputs.pr_number }} # mais le résultat est rapporté sur la PR d'origine (0 = pas de commentaire)
      checkout_ref: ${{ inputs.checkout_ref }}
    secrets: inherit

  # Publie l'APK et la version, pour qu'ami-notifications-api puisse les récupérer.
  publish-version:
    needs: build
    if: ${{ inputs.version_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-staging-debug
          path: dist

      - name: Écrire version.json
        env:
          TAG: ${{ inputs.version_tag }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cat > dist/version.json <<EOF
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "tag": "$TAG",
            "sha": "$COMMIT_SHA"
          }
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-staging-debug-${{ inputs.version_tag }}
          path: dist
          retention-days: 90
          overwrite: true
